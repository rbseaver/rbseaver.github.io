name: Update KRVS Feed

on:
  schedule:
    - cron: "0 9 * * *"   # every day at 9 AM Central
  workflow_dispatch:      # allow manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python ./krvs-feed/scrape.py
      - name: Commit & push feed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add krvs-interviews.xml
          git commit -m "Auto-update KRVS feed [skip ci]" || echo "No changes"
          git push
